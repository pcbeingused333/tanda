<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tanda</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #677085; --line: #e3e6ec;
  --accent: #3b6fe0; --ok: #1f9d55; --warn: #c27c0e; --bad: #c8414b; --hold: #8a55d6;
  --card: #ffffff; --shadow: 0 1px 2px rgba(20, 30, 50, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #191d25; --ink: #e6e9ef; --muted: #8b93a6; --line: #2a303c;
    --accent: #6d97ff; --ok: #3cc47c; --warn: #e3a03a; --bad: #f0626c; --hold: #b38af0;
    --card: #1f242e; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0; }
.pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.pill.running { color: var(--ok); border-color: var(--ok); }
.spacer { flex: 1; }
button { font: inherit; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
a { color: var(--accent); }
main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; align-items: start; align-content: start; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 120px; }
.col h2 { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; display: flex; justify-content: space-between; color: var(--muted); }
.col h2 .n { color: var(--ink); }
.col.work h2 { color: var(--accent); }
.col.hold h2 { color: var(--hold); }
.col.done h2 { color: var(--ok); }
.col.dropped h2 { color: var(--bad); }
.card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 8px 9px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.col.work .card { border-left-color: var(--accent); }
.col.hold .card { border-left-color: var(--hold); }
.col.done .card { border-left-color: var(--ok); opacity: .8; }
.col.dropped .card { border-left-color: var(--bad); opacity: .7; }
.card .t { font-weight: 550; overflow-wrap: anywhere; }
.card .m { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
#events { max-height: 55vh; overflow: auto; }
.side section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
.side h3 { margin: 0 0 8px; font-size: 13px; }
.w { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.w:last-child { border: 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.ev { font-size: 12px; color: var(--muted); padding: 3px 0; }
.ev b { color: var(--ink); font-weight: 550; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(760px, 94vw); padding: 0; }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.dh { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: start; }
.dh h2 { margin: 0; font-size: 16px; flex: 1; }
.db { padding: 14px 16px; max-height: 70vh; overflow: auto; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 12px; }
.kv div:nth-child(odd) { color: var(--muted); }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 300px; font-size: 12px; white-space: pre-wrap; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
.form { display: grid; gap: 8px; }
.empty { color: var(--muted); font-size: 12px; }
.err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="name">tanda</h1>
  <span id="run" class="pill">…</span>
  <span id="totals" class="pill"></span>
  <div class="spacer"></div>
  <button id="addBtn">+ Add item</button>
  <button id="stopBtn" class="danger">Stop tanda</button>
</header>
<main>
  <div class="board" id="board"></div>
  <aside class="side">
    <section><h3>Workers</h3><div id="workers"></div></section>
    <section><h3>Activity</h3><div id="events"></div></section>
  </aside>
</main>

<dialog id="dlg"><div class="dh"><h2 id="dTitle"></h2><button onclick="dlg.close()">Close</button></div><div class="db" id="dBody"></div></dialog>
<dialog id="addDlg"><div class="dh"><h2>Add item</h2><button onclick="addDlg.close()">Close</button></div>
  <div class="db"><div class="form">
    <input id="aTitle" placeholder="Title: what and why">
    <input id="aGroup" placeholder="Group (owner/repo, area…)">
    <input id="aRef" placeholder="Ref (issue number, key…)">
    <input id="aPrio" type="number" min="1" max="9" value="5" placeholder="Priority 1–9">
    <textarea id="aNote" rows="3" placeholder="Note"></textarea>
    <div class="err" id="aErr"></div>
    <button class="primary" id="aSave">Add</button>
  </div></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null;

function ago(t) {
  const s = Math.max(0, S.now - t);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  return Math.floor(s / 3600) + 'h' + String(Math.floor(s % 3600 / 60)).padStart(2, '0');
}
function colClass(state) {
  if (state === 'DONE') return 'done';
  if (state === 'DROPPED') return 'dropped';
  if (state === S.hold) return 'hold';
  if (S.roles.some((r) => r.working === state)) return 'work';
  return '';
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function render() {
  $('name').textContent = 'tanda · ' + S.name;
  const running = S.runs.filter((r) => r.ended === null);
  $('run').textContent = S.stop ? 'stopping…' : S.run_state + (running.length ? ` · ${running.length} agent${running.length > 1 ? 's' : ''} working` : '');
  $('run').className = 'pill' + (S.run_state === 'running' ? ' running' : '');
  const active = S.items.filter((i) => !['DONE', 'DROPPED'].includes(i.state)).length;
  $('totals').textContent = `${active} active · ${S.items.filter((i) => i.state === 'DONE').length} done this week`;

  $('board').innerHTML = S.states.map((st) => {
    const items = S.items.filter((i) => i.state === st);
    const cards = items.map((i) => `<div class="card" onclick="openItem(${i.id})">
        <div class="t">${esc(i.title)}</div>
        <div class="m"><span>#${i.id}</span>${i.grp ? `<span>${esc(i.grp)}${i.ref ? '#' + esc(i.ref) : ''}</span>` : ''}${i.owner ? `<span>● ${esc(i.owner)}</span>` : ''}<span>${ago(i.updated)}</span></div>
      </div>`).join('') || '<div class="empty">—</div>';
    return `<div class="col ${colClass(st)}"><h2><span>${esc(st)}</span><span class="n">${items.length}</span></h2>${cards}</div>`;
  }).join('');

  const latest = {};
  for (const r of S.runs) if (!latest[r.worker]) latest[r.worker] = r;
  const ws = Object.values(latest).sort((a, b) => a.worker.localeCompare(b.worker));
  $('workers').innerHTML = ws.map((r) => {
    const on = r.ended === null;
    return `<div class="w"><span><span class="dot ${on ? 'on' : ''}"></span>${esc(r.worker)}</span>
      <span>${r.item ? `<a href="#" onclick="openItem(${r.item});return false">#${r.item}</a> · ` : ''}${on ? ago(r.started) : 'exit ' + r.exit}</span></div>`;
  }).join('') || '<div class="empty">No agent has run yet. Start one with <code>tanda run</code>.</div>';

  $('events').innerHTML = S.events.slice(0, 30).map((e) =>
    `<div class="ev">${ago(e.at)} · <b>${esc(e.actor || '?')}</b> ${e.item ? `<a href="#" onclick="openItem(${e.item});return false">#${e.item}</a>` : ''} ${esc(e.old || '∅')} → <b>${esc(e.new)}</b>${e.note ? ' · ' + esc(e.note) : ''}</div>`
  ).join('') || '<div class="empty">Nothing yet.</div>';
}

async function refresh() {
  try { S = await api('/api/state'); render(); } catch (e) { $('run').textContent = 'UI lost the server'; }
}

async function openItem(id) {
  const { item, events } = await api('/api/item/' + id);
  $('dTitle').textContent = `#${item.id} · ${item.title}`;
  const fields = Object.entries(item.fields || {});
  const runs = S.runs.filter((r) => r.item === id);
  $('dBody').innerHTML = `
    <div class="kv">
      <div>State</div><div><b>${esc(item.state)}</b></div>
      <div>Group / ref</div><div>${esc(item.grp) || '—'} ${item.ref ? '#' + esc(item.ref) : ''}</div>
      <div>Kind · priority</div><div>${esc(item.kind) || '—'} · p${item.priority}</div>
      <div>Owner</div><div>${esc(item.owner) || '—'}</div>
      <div>Note</div><div>${esc(item.note) || '—'}</div>
      ${fields.map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}
    </div>
    <div><b>Move to</b> <span class="empty">(you decide; agents can only give their own verdicts)</span></div>
    <input id="mNote" placeholder="Note for this move (optional)" style="margin-top:6px">
    <div class="actions">${S.states.filter((s) => s !== item.state).map((s) => `<button onclick="move(${id}, '${s}')">${esc(s)}</button>`).join('')}</div>
    <div class="err" id="mErr"></div>
    <h3>History</h3>
    ${events.map((e) => `<div class="ev">${new Date(e.at * 1000).toLocaleString()} · <b>${esc(e.actor)}</b> ${esc(e.old || '∅')} → <b>${esc(e.new)}</b> ${esc(e.note)}</div>`).join('')}
    ${runs.length ? `<h3>Agent runs</h3>${runs.map((r) => `<button onclick="showLog(${r.id})">${esc(r.worker)} · ${r.ended === null ? 'running' : 'exit ' + r.exit}</button>`).join(' ')}<pre id="log">Pick a run to see its log.</pre>` : ''}`;
  if (!$('dlg').open) $('dlg').showModal();
}
async function showLog(runId) { $('log').textContent = (await api('/api/log/' + runId)).log; }
async function move(id, state) {
  try { await api('/api/set', { id, state, note: $('mNote').value }); await refresh(); openItem(id); }
  catch (e) { $('mErr').textContent = e.message; }
}

$('addBtn').onclick = () => { $('aErr').textContent = ''; $('addDlg').showModal(); };
$('aSave').onclick = async () => {
  try {
    await api('/api/add', { title: $('aTitle').value, group: $('aGroup').value, ref: $('aRef').value, priority: $('aPrio').value, note: $('aNote').value });
    $('addDlg').close(); ['aTitle', 'aGroup', 'aRef', 'aNote'].forEach((k) => $(k).value = ''); refresh();
  } catch (e) { $('aErr').textContent = e.message; }
};
$('stopBtn').onclick = async () => { if (confirm('Stop the tanda? Workers finish their current item, then exit.')) { await api('/api/stop', {}); refresh(); } };

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
